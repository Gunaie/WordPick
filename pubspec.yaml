name: english_study
description: "跨端英语学习工具：英美双发音、四六级/考研词库、拼写练习、错题本与笔记"
publish_to: 'none'

version: 0.22.0+22

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Flutter 3.50 起 package:flutter/material.dart 已弃用，官方后继为 material_ui
  material_ui: ^1.11.0

  cupertino_icons: ^1.0.8

  # HTTP 请求（有道 / Free Dictionary）
  http: ^1.6.0

  # 音频播放（英美发音）
  audioplayers: ^6.8.1

  # 本地数据库（原生 FFI，非插件）
  sqlite3: ^3.8.0

  # 跨平台数据目录
  path: ^1.9.0
  path_provider: ^2.1.6

  # Web 端 localStorage（持久化学习进度）
  web: ^1.0.0

  # 生成跨端唯一的笔记 ID
  uuid: ^4.6.0

  # 网络失败时的设备 TTS 兜底
  flutter_tts: ^4.2.3

  # 原生端导出文件调起系统分享
  share_plus: ^10.1.4

  # 拍照识别手写：取图（相机 / 相册）
  image_picker: ^1.2.4

  # 端上离线文字识别（中文 + 拉丁，仅 Android / iOS，模型随包）
  google_mlkit_text_recognition: ^1.0.3

  # FSRS-6 间隔重复调度（P1 评估用，迁移后替换自实现 SM-2）
  fsrs: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/

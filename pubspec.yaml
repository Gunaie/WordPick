name: english_study
description: "跨端英语学习工具：自建单词本、英美双发音、四选一与拼写练习、FSRS-6 复习、笔记与学习统计"
publish_to: 'none'

version: 0.23.0+23

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Flutter 3.50 起 package:flutter/material.dart 已弃用，官方后继为 material_ui
  material_ui: ^1.11.0

  # HTTP 请求（有道 / Free Dictionary）
  http: ^1.6.0

  # 音频播放（英美发音）
  audioplayers: ^6.8.1

  # 本地数据库（原生 FFI，非插件）
  sqlite3: ^3.8.0

  # 跨平台数据目录
  path: ^1.9.0
  path_provider: ^2.1.6

  # Web 端 localStorage（持久化学习进度）
  web: ^1.0.0

  # 生成跨端唯一的笔记 ID
  uuid: ^4.6.0

  # 网络失败时的设备 TTS 兜底
  flutter_tts: ^4.2.3

  # 原生端导出文件调起系统分享
  share_plus: ^10.1.4

  # 运行时同步配置（BYOC）：用户在设置页自填的 CloudBase 环境与 Key 存这里。
  # 用 Publishable（anon）Key，不是高价值密钥，无需加密存储；Web 端走 localStorage。
  shared_preferences: ^2.3.4

  # FSRS-6 间隔重复调度（默认算法，SM-2 可回滚）
  fsrs: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# sqlite3 3.9 起用 native asset hook 从 GitHub Release 下载预编译库。
# - Windows：用系统自带的 winsqlite3.dll（离线、免下载），测试与桌面构建都走它；
#   本项目只用到基础建表 / PRAGMA，系统库够用。
# - Android / iOS：仍从 Release 下载，直连 github.com 超时，走 ghproxy.net 镜像
#   （ghfast.top 对 release 大文件间歇性卡住：HEAD 200 但下载 0 字节；ghproxy.net 实测可下）。
hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
        default: sqlite3
      name:
        windows: winsqlite3
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

flutter:
  uses-material-design: true

  assets:
    - assets/data/

# 本机 15.5GB 物理内存、提交上限约 27GB，构建时系统 commit 余量常只剩 2GB：
# 大堆会直接 malloc 失败（daemon 崩溃），故限制堆/元空间并减少并发 worker
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
# Kotlin 默认另起编译进程（额外 1-2GB 提交），本机改用进程内编译
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

org.gradle.daemon=false

# pub 缓存与项目不在同一盘符时，Kotlin 增量缓存会因相对路径转换失败
kotlin.incremental=false

